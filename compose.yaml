###############################################################################
# Development environment.
#
# Kubernetes is never required to install or run this platform; this file plus
# a MariaDB and a Redis is the whole dependency surface.
#
# Vite runs on the host (`npm run dev`), not in a container: hot reload over a
# bind mount is materially slower and adds no fidelity.
###############################################################################

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  env_file: [.env]
  volumes:
    - .:/var/www/html
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    container_name: infracms-app

  web:
    image: nginx:1.27-alpine
    container_name: infracms-web
    ports:
      - '${APP_PORT:-8080}:80'
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  queue:
    <<: *app
    container_name: infracms-queue
    command: php artisan horizon
    healthcheck:
      test: ['CMD', 'php', 'artisan', 'horizon:status']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    container_name: infracms-scheduler
    command: php artisan schedule:work

  db:
    image: mariadb:11.8
    container_name: infracms-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
      MARIADB_DATABASE: ${DB_DATABASE:-infracms}
      MARIADB_USER: ${DB_USERNAME:-infracms}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - '${DB_FORWARD_PORT:-33061}:3306'
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mariadb/init-test-database.sh:/docker-entrypoint-initdb.d/10-test-database.sh:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: infracms-redis
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_FORWARD_PORT:-63791}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: infracms-mailpit
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: infracms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-infracms}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-infracms-secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-infracms} ${AWS_SECRET_ACCESS_KEY:-infracms-secret} &&
      mc mb --ignore-existing local/${AWS_BUCKET:-infracms} &&
      echo 'MinIO bucket ready.'
      "
    restart: 'no'

volumes:
  db-data:
  redis-data:
  minio-data:
